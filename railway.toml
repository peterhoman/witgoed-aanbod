[build]
# De Python-versie staat in het bestand .python-version (3.12, vastgezet op
# 3 oktober 2026). Nixpacks leest dat bij elke bouw. Tot dan koos Railway
# zelf de versie; een stille sprong naar een nieuwere Python kan de
# vastgezette bibliotheken in requirements.txt onbruikbaar maken.
builder = "nixpacks"

[deploy]
# 1 proces (dus 1 APScheduler, geen dubbele syncs) met 8 threads zodat
# gelijktijdige bezoekers niet op elkaar hoeven te wachten — met de
# standaard sync-worker verwerkte de site maar 1 request tegelijk.
startCommand = "gunicorn --threads 8 --timeout 60 wsgi:app"
healthcheckPath = "/"
healthcheckTimeout = 5
