{% extends 'base.html' %}

{% block title %}Contact | WitgoedAanbod.nl{% endblock %}

{% block content %}
<div class="container legal-page">
    <h1>Contact</h1>

    <div class="contact-content">
        <h2>Neem Contact Met Ons Op</h2>

        <div class="contact-grid">
            <div class="contact-info">
                <h3>Email</h3>
                <p><a href="mailto:info@witgoedaanbod.nl">info@witgoedaanbod.nl</a></p>

                <h3>Website</h3>
                <p><a href="https://witgoedaanbod.nl">witgoedaanbod.nl</a></p>

                <h3>Bedrijf</h3>
                <p>WitgoedAanbod.nl<br>Nederland</p>
            </div>

            <div class="contact-form">
                <h3>Contactformulier</h3>
                <form method="post" action="/contact" class="form">
                    <div class="form-group">
                        <label for="name">Naam *</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Onderwerp *</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Bericht *</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>

                    <button type="submit" class="btn-primary">Verstuur</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
